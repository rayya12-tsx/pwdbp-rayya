<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Contoh Perulangan For</title>
</head>
<body>

<h2>Contoh Perulangan For</h2>

<p id="demo"></p>

<script>
var text = "";
var i;
for (i = 0; i < 10; i++) {
  text += "Angka " + i + "<br>";
}
document.getElementById("demo").innerHTML = text;
</script>

</body>
</html>
