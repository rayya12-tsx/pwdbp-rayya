<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Contoh perulangan do while</title>
</head>
<body>

<h2>Contoh perulangan do while</h2>

<p id="demo"></p>

<script>
var text = "";
var i = 0;

do {
  text += "<br>Angka " + i;
  i++;
}
while (i < 10);

document.getElementById("demo").innerHTML = text;
</script>

</body>
</html>
