<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Contoh Switch</title>
</head>
<body>

<h2>Contoh Switch</h2>

<p id="demo"></p>

<script>
var x = 1;
var text;

switch (x) {
  case 1:
    text = "Angka satu";
    break;
  case 2:
    text = "Angka Dua";
    break;
  default:
    text = "Tidak ada keterangan";
}
document.getElementById("demo").innerHTML = text;
</script>

</body>
</html>
